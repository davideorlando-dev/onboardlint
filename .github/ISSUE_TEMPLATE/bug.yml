name: Bug report
description: Report an incorrect check, crash, or confusing result.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please do not attach private repositories or sensitive source code. Use a minimal fixture instead.
  - type: input
    id: version
    attributes:
      label: OnboardLint version
      placeholder: 0.1.0
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include file names and small excerpts only; remove secrets and personal data.
    validations:
      required: true
